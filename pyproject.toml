[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connect4-rl"
version = "0.1.0"
description = "Connect Four RL Lab — game engine, agents, and (later) self-play training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
eval = ["matplotlib>=3.8"]
rl = ["torch>=2.2"]

[project.scripts]
connect4 = "connect4.play:main"
connect4-eval = "connect4.training.evaluate:main"
connect4-train-dqn = "connect4.training.train_dqn:main"

[tool.setuptools.packages.find]
include = ["connect4*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
